<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Drive Delivery · 网盘发货助手</title></head>
<body><header><a class="brand" href="#">↗ <span>Drive Delivery<small>网盘发货助手 · Browser Edition</small></span></a><select id="language" aria-label="Language / 语言"><option value="zh-CN">简体中文</option><option value="en">English</option></select></header>
<main>
  <section class="hero"><span class="eyebrow" data-i18n="eyebrow"></span><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></section>
  <div id="fatal" role="alert" hidden></div>
  <section id="drives" class="drives" aria-label="Cloud drives"></section>
  <section id="drop-zone" class="drop-zone">
    <button id="choose" class="plus" aria-label="选择文件 / Choose files">＋</button>
    <h2 data-i18n="drop"></h2><p data-i18n="folderHint"></p>
    <div class="actions"><button id="files-button" data-i18n="files"></button><button id="folder-button" class="secondary" data-i18n="folder"></button></div>
    <input id="files" type="file" multiple hidden><input id="folder" type="file" webkitdirectory multiple hidden>
  </section>
  <section class="queue-bar"><div><strong id="queue-title"></strong><p id="counts"></p><small data-i18n="pauseHint"></small></div><button id="pause" class="secondary"></button></section>
  <label class="share-option"><input id="public-share" type="checkbox"><span data-i18n="share"></span></label>
  <p class="session-note" data-i18n="sessionHint"></p>
  <section id="jobs" aria-live="polite"></section>
  <section class="history-section"><h2 data-i18n="history"></h2><div id="history"></div><button id="clear-history" class="secondary" data-i18n="clearHistory"></button></section>
  <footer><span data-i18n="privacy"></span><a href="https://github.com/guoji1hao/drive-delivery" target="_blank" rel="noreferrer">GitHub</a></footer>
</main><div id="toast" role="status" hidden></div><script type="module" src="/main.js"></script></body></html>
